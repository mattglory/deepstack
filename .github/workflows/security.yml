name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC, so new advisories surface without a code change

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Can fail, deliberately: a check that cannot go red is not evidence of anything.
      - name: Audit agent dependencies
        run: npm audit --audit-level=high
      # if: always() so a red root audit never hides the contract-test dependencies' audit.
      - name: Audit contract-test dependencies
        if: always()
        run: cd clarinet && npm audit --audit-level=high

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
