# Weekly dependency updates. Minor and patch bumps are grouped into one PR per directory so
# they're cheap to review; majors arrive one at a time. CI runs the unit and contract suites
# on every Dependabot PR before anything is merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: "/clarinet"
    schedule:
      interval: weekly
    # vitest 5 breaks the Clarinet suite (PR #32); move majors deliberately, with test changes.
    ignore:
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
